<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MobileMart - Shop On The Go</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="header-left">
            <i class="fas fa-bars menu-toggle"></i>
        </div>
        <div class="header-center">
            <h1>MobileMart</h1>
        </div>
        <div class="header-right">
            <i class="fas fa-search"></i>
            <i class="fas fa-shopping-bag"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Categories Carousel -->
        <section class="categories">
            <div class="category-scroll">
                <div class="category-item active">
                    <i class="fas fa-tshirt"></i>
                    <span>Fashion</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-mobile-alt"></i>
                    <span>Electronics</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-gamepad"></i>
                    <span>Gaming</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-spa"></i>
                    <span>Beauty</span>
                </div>
            </div>
        </section>

        <!-- Featured Products -->
        <section class="featured">
            <h2>Featured Today</h2>
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-image">
                        <img src="https://source.unsplash.com/random/300x300/?smartphone" alt="Smartphone">
                        <span class="badge">NEW</span>
                    </div>
                    <div class="product-info">
                        <h3>Premium Smartphone</h3>
                        <div class="rating">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star-half-alt"></i>
                            <span>4.5</span>
                        </div>
                        <div class="price">
                            <span class="current">$699</span>
                            <span class="original">$799</span>
                        </div>
                        <button class="add-to-cart">
                            <i class="fas fa-shopping-cart"></i>
                            Add to Cart
                        </button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="https://source.unsplash.com/random/300x300/?sneakers" alt="Sneakers">
                        <span class="badge discount">-20%</span>
                    </div>
                    <div class="product-info">
                        <h3>Urban Sneakers</h3>
                        <div class="rating">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="far fa-star"></i>
                            <span>4.0</span>
                        </div>
                        <div class="price">
                            <span class="current">$80</span>
                            <span class="original">$100</span>
                        </div>
                        <button class="add-to-cart">
                            <i class="fas fa-shopping-cart"></i>
                            Add to Cart
                        </button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="https://source.unsplash.com/random/300x300/?watch" alt="Smart Watch">
                    </div>
                    <div class="product-info">
                        <h3>Smart Watch</h3>
                        <div class="rating">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <span>5.0</span>
                        </div>
                        <div class="price">
                            <span class="current">$199</span>
                        </div>
                        <button class="add-to-cart">
                            <i class="fas fa-shopping-cart"></i>
                            Add to Cart
                        </button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-image">
                        <img src="https://source.unsplash.com/random/300x300/?headphones" alt="Headphones">
                        <span class="badge">HOT</span>
                    </div>
                    <div class="product-info">
                        <h3>Noise Cancelling Headphones</h3>
                        <div class="rating">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <span>4.8</span>
                        </div>
                        <div class="price">
                            <span class="current">$249</span>
                            <span class="original">$299</span>
                        </div>
                        <button class="add-to-cart">
                            <i class="fas fa-shopping-cart"></i>
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-fire"></i>
                <span>Trending</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-cart-plus"></i>
                <span>Cart</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </main>

    <!-- Shopping Cart Sidebar (Hidden by default) -->
    <div class="cart-sidebar">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <i class="fas fa-times cart-close"></i>
        </div>
        <div class="cart-items">
            <!-- Cart items will be added here dynamically -->
            <div class="empty-cart">
                <i class="fas fa-shopping-bag"></i>
                <p>Your cart is empty</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span class="total-amount">$0</span>
            </div>
            <button class="checkout-btn" disabled>Proceed to Checkout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
